name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (0.x.y)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install MinGW
      uses: egor-tensin/setup-mingw@84c781b557efd538dec66bde06988d81cd3138cf

    - uses: luarocks/gh-actions-lua@master
      with:
        luaVersion: "5.4"

    - uses: luarocks/gh-actions-luarocks@master

    - env:
        VERSION: ${{ inputs.version }}
        LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        GITHUB_USER: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "$(curl https://api.github.com/users/$GITHUB_USER | jq -r .name)"
        git config --global user.email "$GITHUB_USER@users.noreply.github.com"
        extras/release.sh $VERSION

  binaries:
    needs: [release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: v${{ inputs.version }}

    - uses: luarocks/gh-actions-lua@master
      with:
        luaVersion: "5.4"

    - name: Build binary
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        case "$PLATFORM" in
          macos-*) extras/binary.sh --macos ;;
          *)       extras/binary.sh ;;
        esac

    - name: Package
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        folder="tl-${VERSION}-${PLATFORM}"
        cat <<EOF > _binary/tlconfig.lua
        return {
           source_dir = "src",
           build_dir = "build",
        }
        EOF
        rm -rf "$folder"
        mkdir "$folder"
        cp README.md CHANGELOG.md LICENSE _binary/tlconfig.lua "$folder"
        cp -a docs/ "$folder"
        mkdir "$folder"/build
        cp tl.lua "$folder"/build
        cp _binary/build/tl "$folder"
        tar czvpf "${folder}.tar.gz" "$folder"

    - name: Upload to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ matrix.platform }}
      run: gh release upload "v${VERSION}" "tl-${VERSION}-${PLATFORM}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  docs-latest:
    needs: [release]
    uses: ./.github/workflows/composite-docs.yml
    secrets: inherit
    with:
      ref: v${{ inputs.version }}
      target-directory: 'book/latest'

  docs-versioned:
    needs: [release]
    uses: ./.github/workflows/composite-docs.yml
    secrets: inherit
    with:
      ref: v${{ inputs.version }}
      target-directory: book/{{ inputs.version }}
