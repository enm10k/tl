name: release-binaries

# Build and publish prebuilt ARM binaries for Linux and macOS.
#
# The existing `release` workflow builds and publishes the x86_64 Linux and
# Windows binaries (via extras/release.sh). This workflow runs whenever a
# release is published and attaches the ARM builds to that same release,
# leaving the existing x86_64 flow untouched.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to (e.g. v0.24.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            binary: tl
          - os: macos-14
            platform: macos-arm64
            binary: tl

    runs-on: ${{ matrix.os }}

    steps:
    - name: Resolve tag
      id: tag
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      run: |
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - uses: luarocks/gh-actions-lua@master
      with:
        luaVersion: "5.4"

    - name: Build binary
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        case "$PLATFORM" in
          macos-*) extras/binary.sh --macos ;;
          *)       extras/binary.sh ;;
        esac

    - name: Package
      env:
        VERSION: ${{ steps.tag.outputs.version }}
        PLATFORM: ${{ matrix.platform }}
        BINARY: ${{ matrix.binary }}
      run: |
        folder="tl-${VERSION}-${PLATFORM}"
        cat <<EOF > _binary/tlconfig.lua
        return {
           source_dir = "src",
           build_dir = "build",
        }
        EOF
        rm -rf "$folder"
        mkdir "$folder"
        cp README.md CHANGELOG.md LICENSE _binary/tlconfig.lua "$folder"
        cp -a docs/ "$folder"
        mkdir "$folder"/build
        cp tl.lua "$folder"/build
        cp "_binary/build/${BINARY}" "$folder"
        tar czvpf "${folder}.tar.gz" "$folder"

    - name: Upload to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
        VERSION: ${{ steps.tag.outputs.version }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        gh release upload "$TAG" "tl-${VERSION}-${PLATFORM}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
